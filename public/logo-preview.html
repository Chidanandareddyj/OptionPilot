<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Logo Comparison & Preview</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #06193e; color: white; padding: 40px; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .card { padding: 32px 24px; border-radius: 14px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    .dark-app { background: #06245e; color: #ffffff; }
    .light-card { background: #ffffff; color: #111827; border-color: #e5e7eb; }
    .navbar-demo { background: rgba(6, 36, 94, 0.9); border: 1px solid rgba(255,255,255,0.15); padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-radius: 8px; margin-top: 16px; font-weight: 600; font-size: 18px; }
    svg { width: 110px; height: 110px; margin: 16px auto; display: block; }
  </style>
</head>
<body>
  <h2>Official OptionPilot Logo — Arrow Head & Proportions Check</h2>
  
  <div class="grid">
    <div class="card light-card">
      <h3 style="margin:0; font-size:15px; color:#0369a1;">Original Brand Colors (Light)</h3>
      <svg viewBox="0 0 120 120" fill="none">
        <path d="M 69 41 L 69 28 C 47 29 29 46 29 68 C 29 78 33 87 39 94 L 51 83 C 47 79 44 74 44 68 C 44 54 55 42 69 41 Z" fill="#12244E" />
        <path d="M 53 84 C 63 78 72 71 78 66 C 72 75 63 83 53 90 Z" fill="#12244E" />
        <path d="M 53 95 C 59 101 67 104 75 103 C 94 101 107 85 107 66 C 107 58 103 50 97 44 L 86 54 C 89 57 92 61 92 66 C 92 78 82 88 71 89 C 66 89 61 88 57 85 Z" fill="#12244E" />
        <!-- Arrow -->
        <path d="M 23 83 C 43 82 62 70 77 45 L 70 39 L 102 29 L 95 61 L 88 55 C 69 74 47 82 23 83 Z" fill="#25B4B6" />
      </svg>
    </div>

    <div class="card dark-app">
      <h3 style="margin:0; font-size:15px; color:#38bdf8;">Adaptive Dark Navbar (Bigger)</h3>
      <svg viewBox="0 0 120 120" fill="none">
        <path d="M 69 41 L 69 28 C 47 29 29 46 29 68 C 29 78 33 87 39 94 L 51 83 C 47 79 44 74 44 68 C 44 54 55 42 69 41 Z" fill="#ffffff" />
        <path d="M 53 84 C 63 78 72 71 78 66 C 72 75 63 83 53 90 Z" fill="#ffffff" />
        <path d="M 53 95 C 59 101 67 104 75 103 C 94 101 107 85 107 66 C 107 58 103 50 97 44 L 86 54 C 89 57 92 61 92 66 C 92 78 82 88 71 89 C 66 89 61 88 57 85 Z" fill="#ffffff" />
        <!-- Arrow -->
        <path d="M 23 83 C 43 82 62 70 77 45 L 70 39 L 102 29 L 95 61 L 88 55 C 69 74 47 82 23 83 Z" fill="#25B4B6" />
      </svg>
      <div class="navbar-demo">
        <svg viewBox="0 0 120 120" fill="none" style="width:32px; height:32px; margin:0; flex-shrink:0;">
          <path d="M 69 41 L 69 28 C 47 29 29 46 29 68 C 29 78 33 87 39 94 L 51 83 C 47 79 44 74 44 68 C 44 54 55 42 69 41 Z" fill="#ffffff" />
          <path d="M 53 84 C 63 78 72 71 78 66 C 72 75 63 83 53 90 Z" fill="#ffffff" />
          <path d="M 53 95 C 59 101 67 104 75 103 C 94 101 107 85 107 66 C 107 58 103 50 97 44 L 86 54 C 89 57 92 61 92 66 C 92 78 82 88 71 89 C 66 89 61 88 57 85 Z" fill="#ffffff" />
          <path d="M 23 83 C 43 82 62 70 77 45 L 70 39 L 102 29 L 95 61 L 88 55 C 69 74 47 82 23 83 Z" fill="#25B4B6" />
        </svg>
        <span>OptionPilot</span>
      </div>
    </div>
  </div>
</body>
</html>
